/var/log/vendra/*.log {
    daily
    rotate 14
    missingok
    notifempty
    compress
    delaycompress
    create 0640 root root
    sharedscripts
    postrotate
        if /usr/bin/systemctl is-active --quiet vendra.service; then
            /usr/bin/systemctl reload vendra.service
        fi
    endscript
}
