ServerRoot /etc/apache2
PidFile /run/vendra/apache.pid
ServerName 2.25.146.67
Listen 8445
LoadModule mpm_prefork_module /usr/lib/apache2/modules/mod_mpm_prefork.so
LoadModule authz_core_module /usr/lib/apache2/modules/mod_authz_core.so
LoadModule authz_host_module /usr/lib/apache2/modules/mod_authz_host.so
LoadModule dir_module /usr/lib/apache2/modules/mod_dir.so
LoadModule mime_module /usr/lib/apache2/modules/mod_mime.so
LoadModule ssl_module /usr/lib/apache2/modules/mod_ssl.so
LoadModule socache_shmcb_module /usr/lib/apache2/modules/mod_socache_shmcb.so
LoadModule headers_module /usr/lib/apache2/modules/mod_headers.so
LoadModule php_module /usr/lib/apache2/modules/libphp8.3.so
PHPIniDir /opt/reporvexo-tools/php/apache2
User vendra-web
Group vendra-web
ServerTokens Prod
ServerSignature Off
StartServers 1
MinSpareServers 1
MaxSpareServers 3
MaxRequestWorkers 8
MaxConnectionsPerChild 500
Timeout 30
KeepAlive On
MaxKeepAliveRequests 100
KeepAliveTimeout 3
TypesConfig /etc/mime.types
ErrorLog /var/log/vendra/error.log
LogFormat "%h %l %u %t \"%r\" %>s %b" common
CustomLog /var/log/vendra/access.log common
SSLSessionCache shmcb:/run/vendra/ssl-cache(512000)
<VirtualHost *:8445>
 DocumentRoot /srv/reporvexo/public
 SSLEngine on
 SSLProtocol -all +TLSv1.2 +TLSv1.3
 SSLCertificateFile /etc/letsencrypt/live/2.25.146.67/fullchain.pem
 SSLCertificateKeyFile /etc/letsencrypt/live/2.25.146.67/privkey.pem
 <Directory /srv/reporvexo/public>
  Require all granted
  Options -Indexes
  AllowOverride None
  DirectoryIndex index.php
  FallbackResource /index.php
  <FilesMatch "^\.">
   Require all denied
  </FilesMatch>
  <FilesMatch "\.php$">
   Require all denied
  </FilesMatch>
  <Files "index.php">
   Require all granted
   SetHandler application/x-httpd-php
  </Files>
 </Directory>
 Header always set X-Content-Type-Options "nosniff"
 Header always set X-Frame-Options "SAMEORIGIN"
 Header always set Referrer-Policy "strict-origin-when-cross-origin"
 php_admin_flag display_errors Off
 php_admin_flag expose_php Off
 php_admin_value upload_max_filesize 5M
 php_admin_value post_max_size 8M
</VirtualHost>
